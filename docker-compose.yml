version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autonews
    # Порт 5432 убран из публичного доступа. Доступ к БД есть только внутри безопасной сети Docker.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autonews"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    # Порт 8002 убран из публичного доступа. Доступ только через прокси Nginx.
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - http_proxy=${HTTP_PROXY}
      - https_proxy=${HTTPS_PROXY}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    # Порт 2000 убран из публичного доступа. Доступ только через прокси Nginx.
    environment:
      - PORT=2000
    depends_on:
      - app

  nginx:
    build:
      context: ./nginx
    # Единственные порты, открытые во внешний мир. Nginx фильтрует и распределяет весь трафик.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_ssl:/etc/nginx/ssl
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - webroot_path:/var/www/certbot
    depends_on:
      - frontend

  prometheus:
    image: prom/prometheus:latest
    container_name: autonews_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    # Закрываем порты prometheus от внешнего мира, они нужны только внутри или для Grafana
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: autonews_grafana
    ports:
      - "3001:3000" # Grafana остается доступной для просмотра дашбордов админом
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  nginx_ssl:
  certbot_etc:
  certbot_var:
  webroot_path:
