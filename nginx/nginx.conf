# Настройка ограничения частоты запросов для защиты от DDoS и парсинга
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Скрытие версии Nginx из заголовков ответов (безопасность)
    server_tokens off;

    # Путь для проверки Certbot (Let's Encrypt ACME Challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Перенаправление с HTTP на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    server_tokens off;

    # SSL Сертификаты (монтируются или генерируются автоматически)
    ssl_certificate /etc/nginx/ssl/live/localhost/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/localhost/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Безопасные HTTP-заголовки для защиты от кликджекинга, XSS и сниффинга
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

    # Логи
    access_log /var/log/nginx/autonews_access.log;
    error_log /var/log/nginx/autonews_error.log;

    # Защищенный прокси для бэкенда (API)
    location /api/ {
        # Применяем ограничение частоты запросов: разрешено 15 запросов в сек, всплеск до 30
        limit_req zone=api_limit burst=30 nodelay;

        # Убираем префикс /api перед отправкой на бэкенд (напр. /api/articles -> /articles)
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://app:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Прокси для фронтенда (Next.js)
    location / {
        proxy_pass http://frontend:2000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Поддержка WebSockets для Next.js Hot Reload
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
